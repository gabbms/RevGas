name: Testes

# Roda a checagem de tipos e os testes em todo PR e em todo push no main.
# Os testes usam WhatsApp e IA falsos: não precisam de segredos nem de internet.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
